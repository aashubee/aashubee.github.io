<svg width="920" height="560" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { font-size:13px; font-weight:bold; fill:#ffffff; }
    .sub { font-size:10px; fill:rgba(255,255,255,0.8); }
    .tiny { font-size:9px; fill:rgba(255,255,255,0.85); }
    .panel-label { font-size:11px; font-weight:bold; fill:#444444; letter-spacing:0.5px; }
    .btn-label { font-size:10px; fill:#555555; }
  </style>

  <!-- White background -->
  <rect width="920" height="560" fill="#f4f4f4"/>

  <!-- Panel labels -->
  <text x="225" y="548" text-anchor="middle" class="panel-label">PCB LAYOUT</text>
  <text x="685" y="548" text-anchor="middle" class="panel-label">USER INTERFACE</text>

  <!-- ═══ LEFT PANEL ═══ -->
  <rect x="10" y="10" width="430" height="525" rx="4" fill="white" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Sub-gig antenna -->
  <rect x="18" y="18" width="414" height="60" rx="3" fill="#1a3a5c"/>
  <text x="225" y="44" text-anchor="middle" class="title">sub-gig antenna</text>
  <text x="225" y="61" text-anchor="middle" class="sub">915 MHz / 433 MHz</text>

  <!-- Sub-gig circuit -->
  <rect x="18" y="84" width="240" height="60" rx="3" fill="#2d5f8a"/>
  <text x="138" y="109" text-anchor="middle" class="title">sub-gig circuit</text>
  <text x="138" y="127" text-anchor="middle" class="sub">RF transceiver IC</text>

  <!-- NFC / RFID -->
  <rect x="18" y="150" width="220" height="268" rx="3" fill="#2e7d32"/>
  <!-- NFC Conn chip -->
  <rect x="18" y="188" width="62" height="46" rx="2" fill="#1b5e20"/>
  <text x="49" y="207" text-anchor="middle" class="tiny">NFC</text>
  <text x="49" y="221" text-anchor="middle" class="tiny">Conn</text>
  <!-- RFID Conn chip -->
  <rect x="18" y="373" width="62" height="46" rx="2" fill="#1b5e20"/>
  <text x="49" y="392" text-anchor="middle" class="tiny">RFID</text>
  <text x="49" y="406" text-anchor="middle" class="tiny">Conn</text>
  <!-- Label -->
  <text x="129" y="288" text-anchor="middle" class="title">NFC / RFID</text>
  <text x="129" y="310" text-anchor="middle" class="sub">loop antenna</text>
  <text x="129" y="328" text-anchor="middle" class="sub">tag read + emulation</text>

  <!-- IR -->
  <rect x="18" y="424" width="220" height="58" rx="3" fill="#bf360c"/>
  <text x="128" y="450" text-anchor="middle" class="title">IR</text>
  <text x="128" y="468" text-anchor="middle" class="sub">blaster + receiver</text>

  <!-- Power -->
  <rect x="244" y="150" width="196" height="122" rx="3" fill="#e65100"/>
  <text x="342" y="196" text-anchor="middle" class="title">Power</text>
  <text x="342" y="216" text-anchor="middle" class="sub">USB-C PD · BMS</text>
  <text x="342" y="233" text-anchor="middle" class="sub">Boost regs · Fuel gauge</text>
  <text x="342" y="250" text-anchor="middle" class="sub">Li-ion / LiFePO₄</text>

  <!-- MCU -->
  <rect x="244" y="278" width="148" height="92" rx="3" fill="#1565c0"/>
  <text x="318" y="318" text-anchor="middle" class="title">MCU</text>
  <text x="318" y="338" text-anchor="middle" class="sub">STM32</text>
  <text x="318" y="356" text-anchor="middle" class="sub">SPI · I²C · UART</text>

  <!-- GPIO strip -->
  <rect x="398" y="278" width="42" height="92" rx="3" fill="#42a5f5"/>
  <text x="419" y="322" text-anchor="middle" font-size="8" font-family="Arial" fill="#0d2040">GPIO</text>
  <text x="419" y="338" text-anchor="middle" font-size="8" font-family="Arial" fill="#0d2040">pins</text>

  <!-- USB + Storage -->
  <rect x="244" y="376" width="196" height="106" rx="3" fill="#4527a0"/>
  <text x="342" y="417" text-anchor="middle" class="title">USB + Storage</text>
  <text x="342" y="438" text-anchor="middle" class="sub">USB-C · SWD/JTAG</text>
  <text x="342" y="456" text-anchor="middle" class="sub">Flash · MicroSD</text>

  <!-- ═══ RIGHT PANEL ═══ -->
  <rect x="455" y="10" width="455" height="525" rx="4" fill="white" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Screen -->
  <rect x="463" y="18" width="439" height="300" rx="3" fill="#ad1457"/>
  <text x="682" y="162" text-anchor="middle" font-size="20" font-weight="bold" font-family="Arial" fill="white">SCREEN</text>
  <text x="682" y="186" text-anchor="middle" class="sub">LCD / OLED</text>

  <!-- D-pad -->
  <rect x="652" y="335" width="60" height="60" rx="3" fill="#757575"/>
  <text x="682" y="372" text-anchor="middle" class="tiny">Up</text>

  <rect x="586" y="401" width="60" height="60" rx="3" fill="#757575"/>
  <text x="616" y="438" text-anchor="middle" class="tiny">Left</text>

  <rect x="652" y="401" width="60" height="60" rx="3" fill="#9e9e9e"/>
  <text x="682" y="438" text-anchor="middle" class="tiny">OK</text>

  <rect x="718" y="401" width="60" height="60" rx="3" fill="#757575"/>
  <text x="748" y="438" text-anchor="middle" class="tiny">Right</text>

  <rect x="652" y="467" width="60" height="60" rx="3" fill="#757575"/>
  <text x="682" y="504" text-anchor="middle" class="tiny">Down</text>

  <!-- Back button -->
  <rect x="463" y="435" width="75" height="60" rx="3" fill="#757575"/>
  <text x="500" y="472" text-anchor="middle" class="tiny">Back</text>

  <!-- Power button -->
  <rect x="836" y="335" width="72" height="60" rx="3" fill="#2e7d32"/>
  <text x="872" y="372" text-anchor="middle" class="tiny">Power</text>

  <!-- BLE -->
  <rect x="790" y="435" width="118" height="60" rx="3" fill="#1a237e"/>
  <text x="849" y="472" text-anchor="middle" class="tiny">BLE 2.4 GHz</text>
</svg>